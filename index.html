function convertTempValue(v, from, to){
  let c;
  if(from==='C') c = v;
  else if(from==='F') c = (v-32)*5/9;
  else c = v - 273.15;
  if(to==='C') return c;
  if(to==='F') return c*9/5+32;
  return c + 273.15;
}

function renderUnit(){
  const u = UNITS[activeUnit];
  const v = n(document.getElementById('uVal').value);
  const from = document.getElementById('uFrom').value;
  if(!from) return;

  const grid = document.getElementById('uGrid');

  // ---- TEMPERATURE ----
  if(u.special === 'temp'){
    const c = convertTempValue(v, from, 'C');
    const f = convertTempValue(v, from, 'F');
    const k = convertTempValue(v, from, 'K');
    document.getElementById('uBase').textContent = fmt(c,2);
    document.getElementById('uBaseLabel').textContent = 'درجه سلسیوس (°C)';
    grid.innerHTML = `
      <div class="conv-item"><span class="ck">سلسیوس</span><span class="cv">${fmt(c,2)} °C</span></div>
      <div class="conv-item"><span class="ck">فارنهایت</span><span class="cv">${fmt(f,2)} °F</span></div>
      <div class="conv-item"><span class="ck">کلوین</span><span class="cv">${fmt(k,2)} K</span></div>`;
    return;
  }

  // ---- PIPE SIZE ----
  if(u.special === 'pipe'){
    // ورودی: NPS (رشته) یا DN/OD (عدد)
    let found = null;
    if(from === 'NPS'){
      // جستجو با رشته NPS
      const inp = document.getElementById('uVal');
      const raw = (inp.value||'').toString().trim().replace('"','').replace('″','').replace('“','').replace('”','');
      found = PIPE_TABLE.find(p => p.nps === raw || p.nps === raw.replace('/', '/'));
      if(!found){
        // اگر عدد وارد شده، اولین سایز بزرگتر را پیدا کن
        const num = parseFloat(raw);
        if(!isNaN(num)) found = PIPE_TABLE.find(p => parseFloat(p.nps)>=num) || PIPE_TABLE[PIPE_TABLE.length-1];
      }
    } else {
      const num = n(document.getElementById('uVal').value);
      if(from === 'DN'){
        found = PIPE_TABLE.find(p => p.dn >= num) || PIPE_TABLE[PIPE_TABLE.length-1];
      } else if(from === 'OD'){
        found = PIPE_TABLE.find(p => p.od >= num) || PIPE_TABLE[PIPE_TABLE.length-1];
      }
    }
    if(!found){
      document.getElementById('uBase').textContent = '—';
      document.getElementById('uBaseLabel').textContent = 'سایز نامعتبر';
      grid.innerHTML = '';
      return;
    }
    document.getElementById('uBase').textContent = 'DN ' + found.dn;
    document.getElementById('uBaseLabel').textContent = 'قطر نامی (میلی‌متر)';
    grid.innerHTML = `
      <div class="conv-item"><span class="ck">NPS (اینچ)</span><span class="cv">${found.nps}"</span></div>
      <div class="conv-item"><span class="ck">DN (mm)</span><span class="cv">DN ${found.dn}</span></div>
      <div class="conv-item"><span class="ck">قطر خارجی واقعی</span><span class="cv">${found.od} mm</span></div>
    `;
    return;
  }

  // ---- STANDARD ----
  const fromU = u.units[from];
  const baseVal = v * fromU.factor;
  const baseU = u.units[u.base];
  const baseDisplay = baseVal / baseU.factor;

  document.getElementById('uBase').textContent = fmt(baseDisplay,4);
  document.getElementById('uBaseLabel').textContent = baseU.label;

  let html = '';
  Object.keys(u.units).forEach(k=>{
    if(k === u.base) return;
    const uu = u.units[k];
    const val = baseVal / uu.factor;
    html += `<div class="conv-item"><span class="ck">${uu.label}</span><span class="cv">${fmt(val,4)}</span></div>`;
  });
  grid.innerHTML = html;
}

function calcFlowVol(){

  const t = n(document.getElementById('fv_time').value);
  const tu = document.getElementById('fv_timeunit').value;

  const flowM3h = flow * FLOW_TO_M3H[fu];
  const timeHr = t * TIME_TO_HR[tu];
  const volM3 = flowM3h * timeHr;
  const volL = volM3 * 1000;
  const volGal = volL / 3.78541;
  const volFt3 = volM3 * 35.3147;

function calcMassVol(){

  let massKgH, volM3H;
  if(type === 'mass'){ massKgH = v; volM3H = v / rho; }
  else { volM3H = v; massKgH = v * rho; }

  const volLh = volM3H * 1000;

function interpSteam(pAbs){
  if(pAbs<=STEAM_SAT[0].p) return STEAM_SAT[0];
  if(pAbs>=STEAM_SAT[STEAM_SAT.length-1].p) return STEAM_SAT[STEAM_SAT.length-1];
  for(let i=0;i<STEAM_SAT.length-1;i++){
    const a=STEAM_SAT[i], b=STEAM_SAT[i+1];
    if(pAbs>=a.p && pAbs<=b.p){
      const r=(pAbs-a.p)/(b.p-a.p);
      return {p:pAbs, t:a.t+r*(b.t-a.t), hf:a.hf+r*(b.hf-a.hf), hfg:a.hfg+r*(b.hfg-a.hfg), vg:a.vg+r*(b.vg-a.vg)};
    }
  }
  return STEAM_SAT[STEAM_SAT.length-1];
}

  mazut:  {name:'مازوت',     LHV:9700, unit:'kg/hr'},
};

function renderSteamHeat(){
  return `
  <div class="card">
    <span class="badge">Steam ↔ Heat ↔ Fuel</span>
    <h2>تبدیل ظرفیت بخار به بار حرارتی و مصرف سوخت</h2>
    <p class="hint">مثال: «۳۰۰۰ kg/hr بخار در ۱۰ bar، چند kW بار حرارتی است؟ مصرف گاز چقدر می‌شود؟»</p>
    <div class="row3">
      <div class="field"><label>دبی بخار</label><input type="number" id="sh_flow" value="3000" step="any" oninput="calcSteamHeat()"></div>
      <div class="field"><label>فشار کاری</label><input type="number" id="sh_p" value="10" step="any" oninput="calcSteamHeat()"><span class="unit">bar (gauge)</span></div>
      <div class="field"><label>راندمان دیگ</label><input type="number" id="sh_eff" value="88" step="any" oninput="calcSteamHeat()"><span class="unit">٪</span></div>
    </div>
    <div class="row3">
      <div class="field"><label>دمای آب تغذیه</label><input type="number" id="sh_tf" value="105" step="any" oninput="calcSteamHeat()"><span class="unit">°C</span></div>
      <div class="field"><label>کیفیت بخار (خشکی)</label><input type="number" id="sh_x" value="97" step="any" oninput="calcSteamHeat()"><span class="unit">٪</span></div>
      <div class="field"><label>سوخت</label>
        <select id="sh_fuel" onchange="calcSteamHeat()">
          <option value="gas" selected>گاز طبیعی</option>
          <option value="diesel">گازوئیل</option>
          <option value="mazut">مازوت</option>
        </select>
      </div>
    </div>
    <div id="sh_result"></div>
  </div>`;
}

function calcSteamHeat(){
  const flow = n(document.getElementById('sh_flow').value);
  const p = n(document.getElementById('sh_p').value);
  const eff = n(document.getElementById('sh_eff').value)/100;
  const tf = n(document.getElementById('sh_tf').value);
  const x = n(document.getElementById('sh_x').value)/100;
  const fuelKey = document.getElementById('sh_fuel').value;

  if(flow<=0 || p<=0){ document.getElementById('sh_result').innerHTML=''; return; }

  const pAbs = p + 1.013;
  const sp = interpSteam(pAbs);
  const hSteam = sp.hf + sp.hfg * x;   // kJ/kg
  const hFeed = tf * 4.187;             // kJ/kg
  const dH = hSteam - hFeed;
  const qKW = flow * dH / 3600;         // kW
  const qKcal = qKW * 860.421;
  const qInput = qKcal / eff;           // kcal/hr ورودی

  const f = FUELS_DATA[fuelKey];
  let fuelRate, fuelUnit;
  if(fuelKey === 'gas'){ fuelRate = qInput / f.HHV; fuelUnit = 'm³/hr'; }
  else { fuelRate = qInput / f.LHV; fuelUnit = 'kg/hr'; }

  document.getElementById('sh_result').innerHTML = `
    <div class="result-main">
      <div class="num">${fmt(qKW,1)} <small style="font-size:.55em;">kW</small></div>
      <div class="lbl">بار حرارتی مفید (${fmt(qKcal,0)} kcal/hr)</div>
    </div>
    <div class="conv-grid">
      <div class="conv-item"><span class="ck">بار حرارتی</span><span class="cv">${fmt(qKcal,0)} kcal/hr</span></div>
      <div class="conv-item"><span class="ck">بار حرارتی</span><span class="cv">${fmt(qKW,2)} kW</span></div>
      <div class="conv-item"><span class="ck">بار حرارتی</span><span class="cv">${fmt(qKcal/8434.5,3)} BHP</span></div>
      <div class="conv-item"><span class="ck">بار ورودی مشعل</span><span class="cv">${fmt(qInput,0)} kcal/hr</span></div>
      <div class="conv-item"><span class="ck">مصرف سوخت — ${f.name}</span><span class="cv">${fmt(fuelRate,2)} ${fuelUnit}</span></div>
      <div class="conv-item"><span class="ck">دمای اشباع در ${p} bar</span><span class="cv">${fmt(sp.t,1)} °C</span></div>
    </div>
    <div class="info-box">
      <b>محاسبه:</b><br>
      h<sub>بخار</sub> (در ${p} bar با کیفیت ${(x*100).toFixed(0)}٪) = ${fmt(hSteam,1)} kJ/kg<br>
      h<sub>آب تغذیه</sub> (در ${tf}°C) = ${fmt(hFeed,1)} kJ/kg<br>
      Δh = ${fmt(dH,1)} kJ/kg &nbsp;|&nbsp; Q = ${fmt(flow,0)} × ${fmt(dH,1)} / 3600 = <b>${fmt(qKW,2)} kW</b><br>
      بار ورودی مشعل = ${fmt(qKcal,0)} ÷ ${(eff*100).toFixed(0)}٪ = <b>${fmt(qInput,0)} kcal/hr</b>
    </div>`;
}

function renderBoilerCap(){

function calcBoilerCap(){
  const v = n(document.getElementById('bc_val').value);
  const u = document.getElementById('bc_unit').value;

  // تبدیل همه به kcal/hr پایه
  let kcal;
  if(u==='kW') kcal = v * 860.421;
  else if(u==='kcal_hr') kcal = v;
  else if(u==='MW') kcal = v * 860421;
  else if(u==='BHP') kcal = v * 8434.5;
  else if(u==='kg_hr_steam') kcal = v * 539;  // گرمای نهان تقریبی
  else if(u==='BTU_hr') kcal = v * 0.252;
  else if(u==='TR') kcal = v * 3024.84;
  else if(u==='HP') kcal = v * 641.19;

  document.getElementById('bc_result').innerHTML = `
    <div class="result-main">
      <div class="num">${fmt(kcal,0)} <small style="font-size:.55em;">kcal/hr</small></div>
      <div class="lbl">معادل اصلی</div>
    </div>
    <div class="conv-grid">
      <div class="conv-item"><span class="ck">کیلووات</span><span class="cv">${fmt(kcal/860.421,2)} kW</span></div>
      <div class="conv-item"><span class="ck">مگاوات</span><span class="cv">${fmt(kcal/860421,4)} MW</span></div>
      <div class="conv-item"><span class="ck">BHP</span><span class="cv">${fmt(kcal/8434.5,3)} BHP</span></div>
      <div class="conv-item"><span class="ck">بخار اشباع (≈)</span><span class="cv">${fmt(kcal/539,1)} kg/hr</span></div>
      <div class="conv-item"><span class="ck">BTU/hr</span><span class="cv">${fmt(kcal/0.252,0)} BTU/hr</span></div>
      <div class="conv-item"><span class="ck">تن تبرید</span><span class="cv">${fmt(kcal/3024.84,3)} TR</span></div>
      <div class="conv-item"><span class="ck">اسب بخار مکانیکی</span><span class="cv">${fmt(kcal/641.19,3)} HP</span></div>
      <div class="conv-item"><span class="ck">کیلوکالری</span><span class="cv">${fmt(kcal,0)} kcal/hr</span></div>
    </div>
    <div class="info-box">
      <b>نکته:</b> تبدیل kg/hr بخار به kcal/hr در این جدول با فرض گرمای نهان تقریبی <b>۵۳۹ kcal/kg</b> انجام شده است. برای محاسبه دقیق‌تر از تب «بخار ↔ حرارت ↔ سوخت» استفاده کنید.
    </div>`;
}

/* ============================================================
   5) فشار ↔ ستون آب ↔ Head پمپ
   ============================================================ */
function renderPressHead(){
  return `
  <div class="card">
    <span class="badge">Pressure ↔ Water Column ↔ Pump Head</span>
    <h2>تبدیل فشار به ستون آب و Head پمپ</h2>
    <p class="hint">مهندسان مکانیک اغلب Head پمپ را با متر ستون آب (m H₂O) بیان می‌کنند. این ابزار تبدیل بین فشار (bar, psi, kPa) و ستون آب (m, mm) و Head را فراهم می‌کند.</p>
    <div class="row">
      <div class="field"><label>مقدار</label><input type="number" id="ph_val" value="10" step="any" oninput="calcPressHead()"></div>
      <div class="field"><label>واحد مبدأ</label>
        <select id="ph_unit" onchange="calcPressHead()">
          <option value="bar" selected>bar</option>
          <option value="psi">psi</option>
          <option value="kPa">kPa</option>
          <option value="MPa">MPa</option>
          <option value="mH2O">m H₂O</option>
          <option value="mmH2O">mm H₂O</option>
          <option value="kg_cm2">kg/cm²</option>
          <option value="atm">atm</option>
        </select>
      </div>
    </div>
    <div id="ph_result"></div>
  </div>`;
}

function calcPressHead(){
  const v = n(document.getElementById('ph_val').value);
  const u = document.getElementById('ph_unit').value;
  // به m H2O پایه
  const to_mH2O = {bar:10.1972, psi:0.70307, kPa:0.101972, MPa:101.972, mH2O:1, mmH2O:0.001, kg_cm2:10, atm:10.3323};
  const mH2O = v * to_mH2O[u];
  const bar = mH2O / 10.1972;
  const psi = bar / 0.0689476;
  const kPa = bar * 100;
  const mmH2O = mH2O * 1000;

  document.getElementById('ph_result').innerHTML = `
    <div class="result-main">
      <div class="num">${fmt(mH2O,3)} <small style="font-size:.55em;">m H₂O</small></div>
      <div class="lbl">ستون آب (معادل Head پمپ)</div>
    </div>
    <div class="conv-grid">
      <div class="conv-item"><span class="ck">ستون آب (متر)</span><span class="cv">${fmt(mH2O,3)} m</span></div>
      <div class="conv-item"><span class="ck">ستون آب (میلی‌متر)</span><span class="cv">${fmt(mmH2O,1)} mm</span></div>
      <div class="conv-item"><span class="ck">بار</span><span class="cv">${fmt(bar,4)} bar</span></div>
      <div class="conv-item"><span class="ck">psi</span><span class="cv">${fmt(psi,3)} psi</span></div>
      <div class="conv-item"><span class="ck">کیلوپاسکال</span><span class="cv">${fmt(kPa,3)} kPa</span></div>
      <div class="conv-item"><span class="ck">kg/cm²</span><span class="cv">${fmt(mH2O/10,4)} kg/cm²</span></div>
    </div>
    <div class="info-box">
      <b>رابطه:</b> ۱ bar ≈ ۱۰.۲ متر ستون آب &nbsp;|&nbsp; ۱ psi ≈ ۰.۷۰۳ متر ستون آب<br>
      <b>مثال کاربردی:</b> پمپ با Head ۵۰ متر ≈ ۴.۹ bar فشار
    </div>`;
}

   6) سختی‌گیر: ppm·m³ ↔ grain
   ============================================================ */
function renderSoftener(){
  return `
  <div class="card">
    <span class="badge">Water Softener Design</span>
    <h2>محاسبه ظرفیت سختی‌گیر (ppm·m³ ↔ grain)</h2>
    <p class="hint">مثال: «آب ۳۰۰ ppm، دبی ۵ m³/hr، دوره احیا ۱ روز — سختی‌گیر چند گرین و چند لیتر رزین می‌خواهد؟»</p>
    <div class="row3">
      <div class="field"><label>سختی آب</label><input type="number" id="sf_hard" value="300" step="any" oninput="calcSoftener()"><span class="unit">ppm CaCO₃</span></div>
      <div class="field"><label>دبی</label><input type="number" id="sf_flow" value="5" step="any" oninput="calcSoftener()"><span class="unit">m³/hr</span></div>
      <div class="field"><label>دوره احیا</label><input type="number" id="sf_days" value="1" step="any" oninput="calcSoftener()"><span class="unit">روز</span></div>
    </div>
    <div class="row3">
      <div class="field"><label>ساعت کار در روز</label><input type="number" id="sf_hours" value="24" step="any" oninput="calcSoftener()"></div>
      <div class="field"><label>ظرفیت ویژه رزین</label><input type="number" id="sf_cap" value="30000" step="any" oninput="calcSoftener()"><span class="unit">grain/ft³</span></div>
      <div class="field"><label>دوز نمک</label><input type="number" id="sf_salt" value="15" step="any" oninput="calcSoftener()"><span class="unit">lb/ft³</span></div>
    </div>
    <div id="sf_result"></div>
  </div>`;
}

function calcSoftener(){
  const hard = n(document.getElementById('sf_hard').value);
  const flow = n(document.getElementById('sf_flow').value);
  const days = n(document.getElementById('sf_days').value);
  const hours = n(document.getElementById('sf_hours').value);
  const cap = n(document.getElementById('sf_cap').value);
  const saltDose = n(document.getElementById('sf_salt').value);

  if(hard<=0||flow<=0||days<=0||cap<=0){ document.getElementById('sf_result').innerHTML=''; return; }

  const volPerCycle = flow * hours * days;             // m³
  const ppmM3 = hard * volPerCycle;                    // ppm·m³
  const grain_US = ppmM3 * 1000 / 17.12;               // grain (US)
  const grainWithMargin = grain_US * 1.3;
  const resinFt3 = grainWithMargin / cap;
  const resinL = resinFt3 * 28.317;
  const saltKg = resinFt3 * saltDose * 0.453592;

  document.getElementById('sf_result').innerHTML = `
    <div class="result-main">
      <div class="num">${fmt(grainWithMargin,0)} <small style="font-size:.5em;">grain</small></div>
      <div class="lbl">ظرفیت رزین لازم (با ۳۰٪ حاشیه)</div>
    </div>
    <div class="conv-grid">
      <div class="conv-item"><span class="ck">حجم آب در هر دوره</span><span class="cv">${fmt(volPerCycle,2)} m³</span></div>
      <div class="conv-item"><span class="ck">ppm·m³</span><span class="cv">${fmt(ppmM3,0)} ppm·m³</span></div>
      <div class="conv-item"><span class="ck">ظرفیت رزین (خالص)</span><span class="cv">${fmt(grain_US,0)} grain</span></div>
      <div class="conv-item"><span class="ck">حجم رزین</span><span class="cv">${fmt(resinFt3,2)} ft³</span></div>
      <div class="conv-item"><span class="ck">حجم رزین</span><span class="cv">${fmt(resinL,1)} L</span></div>
      <div class="conv-item"><span class="ck">نمک هر احیا</span><span class="cv">${fmt(saltKg,2)} kg</span></div>
    </div>
    <div class="info-box">
      <b>محاسبه:</b><br>
      ۱) حجم آب در هر دوره = ${flow} m³/hr × ${hours} hr × ${days} day = <b>${fmt(volPerCycle,2)} m³</b><br>
      ۲) ppm·m³ = ${hard} ppm × ${fmt(volPerCycle,2)} m³ = <b>${fmt(ppmM3,0)}</b><br>
      ۳) grain = ppm·m³ × ۱۰۰۰ ÷ ۱۷.۱۲ = <b>${fmt(grain_US,0)}</b><br>
      ۴) حجم رزین = ${fmt(grainWithMargin,0)} ÷ ${cap} = <b>${fmt(resinFt3,2)} ft³</b><br>
      ۵) نمک = ${fmt(resinFt3,2)} ft³ × ${saltDose} lb/ft³ × ۰.۴۵۳۶ = <b>${fmt(saltKg,2)} kg</b><br>
      <b>توصیه:</b> برای انتخاب مدل سختی‌گیر، عدد رزین به‌دست‌آمده را به اولین مدل بزرگ‌تر کاتالوگ گرد کنید.
    </div>`;
}
